# SPDX-FileCopyrightText: 2026 TSIE
#
# 每次推送到 main、以及每个 PR 都跑。矩阵只有两个系统、一个 Node 版本
# （活跃 LTS）：这个项目刻意在意 Windows（bootstrap 的符号链接/权限位那一堆坑），
# 而 Windows runner 计费是 Linux 的 2 倍，所以只在它上面跑同一套检查，不再加版本矩阵。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # CI 不需要写权限

concurrency:              # 同一分支重复推送时，取消上一次没跑完的
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # 活跃 LTS（Krypton）
          cache: npm

      - run: npm ci

      - name: 类型检查（必须 0 错误）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      # 这一步是本仓库最该守的门：tsconfig 里开了 allowImportingTsExtensions，
      # 若不同时开 rewriteRelativeImportExtensions，tsc 会**照样 emit** 却把 .ts
      # 后缀写进产物 —— dist 能生成、却一加载就 ERR_MODULE_NOT_FOUND。
      # 2026-09-27 发现时 dist/ 已经这么坏了一段时间，因为平时都用 tsx 跑源码。
      - name: 构建产物必须真的能加载
        run: node dist/cli.js --help

      - name: 端到端冒烟（裸机 demo，不依赖任何固件）
        run: npm run demo

      # tools/*.ts 的输出也走同一张文案表（脚本把自己的选择经 TSIE_LANG 传下去）。
      # 英文流程里漏出中文，最初漏的就是这里 —— 所以单独钉一条，两个系统都跑。
      - name: 工具输出跟随语言（tools/initramfs.ts）
        shell: bash
        run: |
          for pair in 'en:Usage:' 'zh:用法:'; do
            lang=${pair%%:*}; want=${pair#*:}
            got=$(TSIE_LANG=$lang npx tsx tools/initramfs.ts 2>&1 || true)
            printf '%s\n' "$got" | grep -qF "$want" \
              || { echo "::error::TSIE_LANG=$lang 时 tools/initramfs.ts 没有输出 '$want'"; exit 1; }
            echo "TSIE_LANG=$lang → OK"
          done

  # 独立可执行文件（Node SEA）。这条链没有别的地方会碰：esbuild 打单文件 CJS、
  # 生成 SEA blob、注入 node 可执行文件、再跑一次 --help 冒烟。任何一个环节坏掉
  # （比如有人给 CLI 又加了顶层 await，CJS 就打包不了）都该在这里当场红，
  # 而不是等到打标签发布时才发现。
  sea:
    name: sea (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 打独立可执行文件并冒烟
        run: npm run sea

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 每个 .ts 都要有 SPDX 头
        run: |
          missing=0
          for f in $(git ls-files '*.ts'); do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0'; then
              echo "::error file=$f::缺少 SPDX-License-Identifier: Apache-2.0"
              missing=1
            fi
          done
          [ "$missing" = 0 ] && echo "OK：所有 .ts 都带 SPDX 头"

      # 仓库是 Apache-2.0：GPL-2.0 的固件/内核/镜像，以及任何第三方大二进制，
      # 一律不得入库（见 AGENTS.md 硬规矩 1）。.gitignore 已经挡住它们，
      # 这里再挡一层 —— 因为 `git add -f` 与改错的 .gitignore 都能绕过第一层。
      - name: 不得提交 GPL / 二进制产物
        run: |
          bad=$(git ls-files | grep -E '^(firmware|linux-image|tmp|dist)/' || true)
          bad="$bad"$'\n'"$(git ls-files | grep -E '\.(fd|img|deb|apk|cpio|bin|elf|iso|raw|qcow2)$' || true)"
          bad=$(printf '%s\n' "$bad" | sed '/^$/d')
          if [ -n "$bad" ]; then
            echo "::error::以下产物不得入库（GPL-2.0 / 第三方二进制）："
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK：没有 GPL / 二进制产物入库"

      # 编辑器与语言的产物缓存：__pycache__、编译出的 .o/.class、DLL 之类。
      # 这条是有来历的：曾在删掉最后一个 .py 的那次提交里，把一个 .pyc 一起提了进去
      # （调试时 import 过它），而上面那条检查只看固件/镜像类扩展名，拦不住。
      - name: 不得提交构建/缓存产物
        run: |
          bad=$(git ls-files | grep -E '(__pycache__|\.py[co]$|\.o$|\.obj$|\.class$|\.dll$|\.dylib$|\.exe$|\.tsbuildinfo$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下构建/缓存产物不得入库："
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK：没有构建/缓存产物入库"

      # 每个 .ps1 都刻意带 UTF-8 BOM：PowerShell 5.1 按 ANSI/GBK 读无 BOM 的 UTF-8
      # 脚本，会直接抛语法错误 —— 那样它连"请装 PowerShell 7+"这句提示都读不到。
      # BOM 很容易被编辑器/格式化工具悄悄吃掉（本仓库里就被吃掉过一次），所以钉一条。
      - name: 所有 .ps1 必须保留 UTF-8 BOM
        run: |
          bad=""
          for f in $(git ls-files '*.ps1'); do
            if ! head -c 3 "$f" | od -An -tx1 | grep -q 'ef bb bf'; then
              echo "::error file=$f::缺少 UTF-8 BOM，PowerShell 5.1 将无法显示版本提示而只报语法错误"
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then exit 1; fi
          echo "OK：所有 .ps1 的 UTF-8 BOM 都在位"

      # 注释式帮助有个静默陷阱：帮助块里**行首的 `.` 会被当成关键字**（.SYNOPSIS/.NOTES/…），
      # 出现一个不认识的关键字，整块帮助就被丢弃、静默回退成"脚本名 + 参数列表"的自动摘要 ——
      # 解析不报错、脚本照跑，只有 Get-Help 的输出悄悄变短。
      # 踩过一次：删掉 `⚠️ .deb 是 ar 归档…` 里的 emoji 后，该行以 `.deb` 开头，
      # 整块帮助就这样没了（渲染长度 1339 → 161）。三条引导路各有一份注释块，都要查。
      - name: 三个 .ps1 的注释式帮助仍然有效
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            for p in direct uboot edk2; do
              len=$(pwsh -NoProfile -Command \
                "(Get-Help ./tools/bootstrap-$p.ps1 | Out-String).Length" | tr -d '\r')
              echo "bootstrap-$p.ps1 帮助渲染长度: $len"
              if [ "${len:-0}" -lt 800 ]; then
                echo "::error file=tools/bootstrap-$p.ps1::注释式帮助未被识别（渲染仅 $len 字节）——多半是帮助块里出现了行首点号的非关键字行"
                exit 1
              fi
            done
            echo "OK：三份帮助块都被正确解析"
          else
            echo "跳过：本机没有 pwsh"
          fi

      # 文案表是单一来源（tools/i18n/messages.tsv），三个读取方都按 key 查它：
      # tools/lib/bootstrap-common.sh + tools/bootstrap-*.sh、同名的 .ps1 一组、
      # 以及 tools/*.ts（经 tools/i18n/read.ts）。
      # 这里守四件事：
      #   1. 表本身格式对（3 列、两种语言都非空）；
      #   2. 每个读取方用到的 key 都在表里（否则运行时会安静地打印出裸 key）；
      #   3. 表里没有**没人用**的 key（死键会烂在表里 —— 值里的 `警告:`/`错误:` 前缀
      #      就曾因为 warn()/die() 写死中文而变成死键，那正是英文运行里漏出中文的原因）；
      #   4. 六份用法文本都在（三条引导路 × 中英，-Help / --help 直接 cat 它们）。
      - name: i18n 文案表完整
        run: |
          bad=$(awk -F'\t' '!/^#/ && NF>0 { if (NF!=3 || $2=="" || $3=="") print NR": "$0 }' tools/i18n/messages.tsv)
          if [ -n "$bad" ]; then
            echo "::error file=tools/i18n/messages.tsv::以下行不是 3 列，或某种语言为空"
            printf '%s\n' "$bad"
            exit 1
          fi

          used=$( { grep -ohE 'msg [a-zA-Z0-9._-]+' tools/lib/*.sh tools/bootstrap-*.sh | awk '{print $2}'
                    # ps1 侧多数 key 是交给 Write-Log/Warn/Die/Ok 的，不能只扫 Msg
                    grep -ohE "(Msg|Write-Log|Write-Warn|Write-Die|Write-Ok) '[a-zA-Z0-9._-]+'" tools/lib/*.ps1 tools/bootstrap-*.ps1 | sed "s/.* '//;s/'//"
                    # TS 侧统一形如 t('ns.key')（含三元里的两个分支）
                    grep -ohE "'[a-z][a-zA-Z0-9]*\.[a-zA-Z0-9.]+'" tools/*.ts | tr -d "'"
                  } | sort -u | tr '\n' ' ' )

          missing=""
          for k in $used; do
            grep -q "^$k	" tools/i18n/messages.tsv || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::脚本用到、但文案表里没有的 key:$missing"
            exit 1
          fi

          dead=""
          for k in $(awk -F'\t' '!/^#/ && NF>0 {print $1}' tools/i18n/messages.tsv); do
            case " $used " in *" $k "*) ;; *) dead="$dead $k" ;; esac
          done
          if [ -n "$dead" ]; then
            echo "::error file=tools/i18n/messages.tsv::文案表里没人用的 key（死键）:$dead"
            exit 1
          fi

          for path in direct uboot edk2; do
            for lang in zh en; do
              f="tools/i18n/usage.$path.$lang.txt"
              if [ ! -s "$f" ]; then
                echo "::error file=$f::用法文本缺失或为空"
                exit 1
              fi
            done
          done
          echo "OK：文案表格式正确，用到的 key 都在，没有死键，六份用法文本齐全"

      # 语言开关必须真的通到用户眼前的那几处：三条引导路的 -Help / --help（各自的用法
      # 文本文件），以及 tools/*.ts 的输出（它由脚本通过 TSIE_LANG 传下去 ——
      # 英文流程里漏出中文，最初就是这里漏的）。
      - name: 语言开关端到端可用
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            for p in direct uboot edk2; do
              for l in zh en; do
                len=$(pwsh -NoProfile -File "tools/bootstrap-$p.ps1" -Help -Lang $l | wc -c)
                echo "bootstrap-$p.ps1 -Help -Lang $l: $len 字节"
                [ "$len" -ge 800 ] || { echo "::error file=tools/bootstrap-$p.ps1::用法文本太短（$len 字节）"; exit 1; }
              done
            done
            # 非法语言值必须报错退出，而不是静默退回中文（否则 -Lang fr 看起来"成功了"）。
            # 用哪种语言报错取决于本机区域，所以两种措辞都接受。
            got=$(TSIE_LANG=fr pwsh -NoProfile -File tools/bootstrap-direct.ps1 2>&1 || true)
            printf '%s\n' "$got" | grep -qE '无法识别的语言|Unrecognized language' \
              || { echo "::error::非法 TSIE_LANG 应当报错，实际输出：$got"; exit 1; }
          else
            echo "跳过 pwsh 侧：本机没有 pwsh"
          fi
          for p in direct uboot edk2; do
            for l in zh en; do
              len=$(bash "tools/bootstrap-$p.sh" --help --lang $l | wc -c)
              echo "bootstrap-$p.sh --help --lang $l: $len 字节"
              [ "$len" -ge 800 ] || { echo "::error file=tools/bootstrap-$p.sh::用法文本太短（$len 字节）"; exit 1; }
            done
          done
          echo "OK：三条引导路、两种语言下帮助与语言校验都对"

      # GitHub 网页编辑器（Add file / 铅笔按钮）**绕过本地的 .gitattributes**，
      # 提交进来的 blob 直接带 CRLF。而 git 的归一是逐个文件"自愈"的：谁下次编辑到它，
      # 谁就得到一份整文件重写的 diff（实测：只加一个换行 → 70 insertions / 69 deletions），
      # 那个文件的 git blame 也就废了。所以在这里挡一道。
      #
      # ⚠️ 必须查 **index**：CI 里 checkout 会按 .gitattributes 把文件还原成 LF，
      # 查工作区永远是干净的、什么也发现不了。
      - name: 不得有 CRLF 行尾入库
        run: |
          bad=$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下文件的 blob 里含 CRLF（网页编辑器提交会绕过 .gitattributes）"
            printf '%s\n' "$bad"
            echo "修法：git add --renormalize . 然后提交" 
            exit 1
          fi
          echo "OK：仓库里所有文本文件都是 LF"
