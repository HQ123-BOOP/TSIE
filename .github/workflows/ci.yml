#
# 每次推送到 main、以及每个 PR 都跑。矩阵只有两个系统、一个 Node 版本
# （活跃 LTS）：这个项目刻意在意 Windows（bootstrap 的符号链接/权限位那一堆坑），
# 而 Windows runner 计费是 Linux 的 2 倍，所以只在它上面跑同一套检查，不再加版本矩阵。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # CI 不需要写权限

concurrency:              # 同一分支重复推送时，取消上一次没跑完的
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # 活跃 LTS（Krypton）
          cache: npm

      - run: npm ci

      - name: 类型检查（必须 0 错误）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      # 这一步是本仓库最该守的门：tsconfig 里开了 allowImportingTsExtensions，
      # 若不同时开 rewriteRelativeImportExtensions，tsc 会**照样 emit** 却把 .ts
      # 后缀写进产物 —— dist 能生成、却一加载就 ERR_MODULE_NOT_FOUND。
      # 2026-09-27 发现时 dist/ 已经这么坏了一段时间，因为平时都用 tsx 跑源码。
      - name: 构建产物必须真的能加载
        run: node dist/cli.js --help

      - name: 端到端冒烟（裸机 demo，不依赖任何固件）
        run: npm run demo

  # 独立可执行文件（Node SEA）。这条链没有别的地方会碰：esbuild 打单文件 CJS、
  # 生成 SEA blob、注入 node 可执行文件、再跑一次 --help 冒烟。任何一个环节坏掉
  # （比如有人给 CLI 又加了顶层 await，CJS 就打包不了）都该在这里当场红，
  # 而不是等到打标签发布时才发现。
  sea:
    name: sea (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 打独立可执行文件并冒烟
        run: npm run sea

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 每个 .ts 都要有 SPDX 头
        run: |
          missing=0
          for f in $(git ls-files '*.ts'); do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0'; then
              echo "::error file=$f::缺少 SPDX-License-Identifier: Apache-2.0"
              missing=1
            fi
          done
          [ "$missing" = 0 ] && echo "OK：所有 .ts 都带 SPDX 头"

      # 仓库是 Apache-2.0：GPL-2.0 的固件/内核/镜像，以及任何第三方大二进制，
      # 一律不得入库（见 AGENTS.md 硬规矩 1）。.gitignore 已经挡住它们，
      # 这里再挡一层 —— 因为 `git add -f` 与改错的 .gitignore 都能绕过第一层。
      - name: 不得提交 GPL / 二进制产物
        run: |
          bad=$(git ls-files | grep -E '^(firmware|linux-image|tmp|dist)/' || true)
          bad="$bad"$'\n'"$(git ls-files | grep -E '\.(fd|img|deb|apk|cpio|bin|elf|iso|raw|qcow2)$' || true)"
          bad=$(printf '%s\n' "$bad" | sed '/^$/d')
          if [ -n "$bad" ]; then
            echo "::error::以下产物不得入库（GPL-2.0 / 第三方二进制）："
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK：没有 GPL / 二进制产物入库"

      # 编辑器与语言的产物缓存：__pycache__、编译出的 .o/.class、DLL 之类。
      # 这条是有来历的：曾在删掉最后一个 .py 的那次提交里，把一个 .pyc 一起提了进去
      # （调试时 import 过它），而上面那条检查只看固件/镜像类扩展名，拦不住。
      - name: 不得提交构建/缓存产物
        run: |
          bad=$(git ls-files | grep -E '(__pycache__|\.py[co]$|\.o$|\.obj$|\.class$|\.dll$|\.dylib$|\.exe$|\.tsbuildinfo$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下构建/缓存产物不得入库："
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK：没有构建/缓存产物入库"

      # GitHub 网页编辑器（Add file / 铅笔按钮）**绕过本地的 .gitattributes**，
      # 提交进来的 blob 直接带 CRLF。而 git 的归一是逐个文件"自愈"的：谁下次编辑到它，
      # 谁就得到一份整文件重写的 diff（实测：只加一个换行 → 70 insertions / 69 deletions），
      # 那个文件的 git blame 也就废了。所以在这里挡一道。
      #
      # ⚠️ 必须查 **index**：CI 里 checkout 会按 .gitattributes 把文件还原成 LF，
      # 查工作区永远是干净的、什么也发现不了。
      - name: 不得有 CRLF 行尾入库
        run: |
          bad=$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)
          if [ -n "$bad" ]; then
            echo "::error::以下文件的 blob 里含 CRLF（网页编辑器提交会绕过 .gitattributes）"
            printf '%s\n' "$bad"
            echo "修法：git add --renormalize . 然后提交" 
            exit 1
          fi
          echo "OK：仓库里所有文本文件都是 LF"
